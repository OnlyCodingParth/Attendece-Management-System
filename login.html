<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | College Attendance Management System</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-card">
    <div class="college-mark">AG</div>
    <h1>AttendGuardian</h1>
    <p class="subtitle">Faculty Login</p>

    <form>
      <label for="faculty-id">Faculty ID / Email</label>
      <input id="faculty-id" type="text" placeholder="Enter your faculty ID or email">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password">

      <!-- This link is used for the UI prototype; no real login is required. -->
      <a class="login-button" href="dashboard.html">Login</a>
    </form>
    <p class="note">College project UI prototype</p>
  </main>
</body>
</html>
